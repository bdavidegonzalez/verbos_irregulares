<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulario General en Inglés</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Volver al menú</a>
        <h1>Vocabulario General</h1>

        <h2>Días de la Semana</h2>
        <div id="table-container-days"></div>

        <h2>Meses del Año</h2>
        <div id="table-container-months"></div>

        <h2>Números</h2>
        <div id="table-container-numbers"></div>

        <h2>Partes de la Casa</h2>
        <div id="table-container-house"></div>

        <h2>Animales</h2>
        <div id="table-container-animals"></div>

        <h2>Rutina Diaria</h2>
        <div id="table-container-routine"></div>
    </div>

    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            createPaginatedTable('table-container-days', studyData.daysOfWeek, ["Inglés", "Español"]);
            createPaginatedTable('table-container-months', studyData.months, ["Inglés", "Español"]);
            createPaginatedTable('table-container-numbers', studyData.numbers, ["Inglés", "Español", "Número"]);
            createPaginatedTable('table-container-house', studyData.houseParts, ["Inglés", "Español"]);
            createPaginatedTable('table-container-animals', studyData.animals, ["Inglés", "Español"]);
            createPaginatedTable('table-container-routine', studyData.dailyRoutine, ["Inglés", "Español"]);
        });
    </script>
</body>
</html>
