<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronunciación de Verbos Regulares</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Volver al menú</a>
        <h1>Pronunciación de "-ed" en Verbos Regulares</h1>

        <h2>Sonido /ɪd/ (después de 't' o 'd')</h2>
        <div id="table-container-id"></div>

        <h2>Sonido /t/ (después de sonidos sordos)</h2>
        <div id="table-container-t"></div>

        <h2>Sonido /d/ (después de sonidos sonoros y vocales)</h2>
        <div id="table-container-d"></div>
    </div>

    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const headers = ["Base Form", "Simple Past", "Past Participle", "Sound", "Spanish"];
            
            createPaginatedTable('table-container-id', studyData.regularVerbsId, headers);
            createPaginatedTable('table-container-t', studyData.regularVerbsT, headers);
            createPaginatedTable('table-container-d', studyData.regularVerbsD, headers);
        });
    </script>
</body>
</html>
