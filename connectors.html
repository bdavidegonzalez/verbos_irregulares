<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectores en Inglés</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Volver al menú</a>
        <h1>Conectores en Inglés (Linking Words)</h1>

        <h2>1. Conectores de Causa y Razón</h2>
        <div id="table-container-cause"></div>

        <h2>2. Conectores de Consecuencia</h2>
        <div id="table-container-result"></div>

        <h2>3. Conectores de Contraste y Oposición</h2>
        <div id="table-container-contrast"></div>

        <h2>4. Conectores de Adición</h2>
        <div id="table-container-addition"></div>

        <h2>5. Conectores de Tiempo y Secuencia</h2>
        <div id="table-container-time"></div>

        <h2>6. Conectores de Condición</h2>
        <div id="table-container-condition"></div>
        
        <h2>7. Conectores de Comparación</h2>
        <div id="table-container-comparison"></div>
    </div>

    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const headers = ["Conector", "Significado", "Ejemplo"];
            createPaginatedTable('table-container-cause', studyData.connectorsCause, headers);
            createPaginatedTable('table-container-result', studyData.connectorsResult, headers);
            createPaginatedTable('table-container-contrast', studyData.connectorsContrast, headers);
            createPaginatedTable('table-container-addition', studyData.connectorsAddition, headers);
            createPaginatedTable('table-container-time', studyData.connectorsTime, headers);
            createPaginatedTable('table-container-condition', studyData.connectorsCondition, headers);
            createPaginatedTable('table-container-comparison', studyData.connectorsComparison, headers);
        });
    </script>
</body>
</html>
